[project]
name = "mini-mds"
version = "0.1.0"
description = "Lightweight, open source, locally-hosted Modern Data Stack"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.13"
dependencies = [
    "dash==2.18.1",
    "dbt-core==1.8.7",
    "dbt-duckdb==1.8.4",
    "dlt==1.1.0",
    "duckdb==1.1.1",
    "great-expectations==0.18.21",
    "plotly==5.24.1",
    "prefect==3.0.3",
    "prefect-dbt==0.6.1",
]

[dependency-groups]
dev = [
    "ruff>=0.11.2",
]

[tool.ruff.lint]
extend-select = ["I"]
